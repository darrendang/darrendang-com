name: Stage approved Nowakowski tribute images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage-nowakowski-images.yml"

permissions:
  contents: write

jobs:
  stage-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved web package
        env:
          PACKAGE_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-f6b0-8230-a7a9-1d9ea8061831/raw?se=2026-09-27T15%3A31%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=be238a4a-b423-5694-a39a-44186d54de5d&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T13%3A36%3A28Z&ske=2026-09-28T13%3A36%3A28Z&sks=b&skv=2026-02-06&sig=DqRR6levMMO3K47%2BrReUTg4E5tCe7TWmXdbRbQHjRQE%3D"
        run: |
          curl --fail --location --retry 3 "$PACKAGE_URL" -o /tmp/nowakowski.zip
          unzip -q /tmp/nowakowski.zip -d /tmp/nowakowski
          test -s /tmp/nowakowski/the-watch-goes-on-radm-nowakowski-poster.webp
          test -s /tmp/nowakowski/nowakowski-zack-usna-appointment.webp

      - name: Stage approved public images
        run: |
          mkdir -p public/images
          for f in \
            the-watch-goes-on-radm-nowakowski-og.webp \
            the-watch-goes-on-radm-nowakowski-poster.webp \
            nowakowski-challenge-coin-back.webp \
            nowakowski-challenge-coin-front.webp \
            nowakowski-darren-chrystina-retirement.webp \
            nowakowski-del-toro-lauper-darren-chrystina.webp \
            nowakowski-madison-uss-iowa.webp \
            nowakowski-nathan-family-vsa-gala.webp \
            nowakowski-podium.webp \
            nowakowski-retirement-color-guard.webp \
            nowakowski-retirement-group.webp \
            nowakowski-zack-pia-vsa-gala.webp \
            nowakowski-zack-usna-appointment.webp
          do
            cp "/tmp/nowakowski/$f" "public/images/$f"
          done

      - name: Commit approved images
        run: |
          git config user.name "DarrenDang.com Asset Stager"
          git config user.email "actions@users.noreply.github.com"
          git add public/images
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Stage Nowakowski tribute web images"
          git push origin HEAD:main
