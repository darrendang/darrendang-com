name: Deploy DarrenDang.com to GitHub Pages

# PRE-LAUNCH SAFETY: deployment is manual. A one-time trigger path is temporarily
# enabled so the first controlled Pages deployment can be validated end to end.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/DEPLOY_PREVIEW_TRIGGER

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Audit public repository
        run: node scripts/public-repo-audit.mjs

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build static export
        env:
          NEXT_PUBLIC_SITE_URL: https://darrendang.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          CONTACT_FORM_ENDPOINT: ${{ vars.CONTACT_FORM_ENDPOINT }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: darrendang.com
        run: npm run build

      - name: Verify export
        run: npm run export:check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
