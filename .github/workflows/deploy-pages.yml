name: Deploy DarrenDang.com to GitHub Pages

# PRE-LAUNCH SAFETY: deployment is manual until Darren approves public launch.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Audit public repository
        run: node scripts/public-repo-audit.mjs

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify public source assets
        run: |
          test -f public/audio/for-those-who-come-after-us.mp3
          test -f public/docs/From_AI_Experiments_to_Institutional_Capability_Darren_Dang.pdf
          test -f public/videos/for-those-who-come-after-us-book-film.mp4
          test -f public/videos/wisdom-has-no-rank-book-film.mp4
          test -f public/videos/dots-book-film.mp4
          test -f public/videos/for-those-who-come-after-us-book-film-poster.jpg
          test -f public/videos/wisdom-has-no-rank-book-film-poster.jpg
          test -f public/videos/dots-book-film-poster.jpg

      - name: Build static export
        env:
          NEXT_PUBLIC_SITE_URL: https://darrendang.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          CONTACT_FORM_ENDPOINT: ${{ vars.CONTACT_FORM_ENDPOINT }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: darrendang.com
        run: npm run build

      - name: Verify export
        run: |
          npm run export:check
          test -f out/audio/for-those-who-come-after-us.mp3
          test -f out/docs/From_AI_Experiments_to_Institutional_Capability_Darren_Dang.pdf
          test -f out/videos/for-those-who-come-after-us-book-film.mp4
          test -f out/videos/wisdom-has-no-rank-book-film.mp4
          test -f out/videos/dots-book-film.mp4
          test -f out/videos/for-those-who-come-after-us-book-film-poster.jpg
          test -f out/videos/wisdom-has-no-rank-book-film-poster.jpg
          test -f out/videos/dots-book-film-poster.jpg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
