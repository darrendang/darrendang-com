name: Deploy DarrenDang.com to GitHub Pages

# PRODUCTION: every validated push to main deploys DarrenDang.com; manual dispatch remains available.
on:
  push:
    branches:
      - main

  workflow_dispatch:
  
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Audit public repository
        run: node scripts/public-repo-audit.mjs

      - name: Verify audio review fingerprints
        run: node scripts/check-audio-review.mjs

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify public source assets
        run: |
          test -f public/audio/for-those-who-come-after-us.mp3
          test -f public/docs/From_AI_Experiments_to_Institutional_Capability_Darren_Dang.pdf

      - name: Check search and purchase safeguards
        run: npm run check:search && npm run check:bookstore

      - name: Build static export
        env:
          NEXT_PUBLIC_SITE_URL: https://darrendang.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          CONTACT_FORM_ENDPOINT: ${{ vars.CONTACT_FORM_ENDPOINT }}
          SHARED_WISDOM_FORM_ENDPOINT: ${{ vars.SHARED_WISDOM_FORM_ENDPOINT }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: darrendang.com
        run: npm run build

      - name: Verify export
        run: |
          npm run export:check
          test -f out/audio/for-those-who-come-after-us.mp3
          test -f out/docs/From_AI_Experiments_to_Institutional_Capability_Darren_Dang.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

      - name: Save changed public URLs for post-deployment notification
        uses: actions/upload-artifact@v4
        with:
          name: search-notification
          path: .search/indexnow.json
          include-hidden-files: true
          retention-days: 14

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout search notification scripts
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download changed public URLs
        uses: actions/download-artifact@v4
        with:
          name: search-notification
          path: .search

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify participating search engines after live verification
        continue-on-error: true
        run: npm run notify:search

      - name: Preserve IndexNow receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-receipt
          path: .search/indexnow-receipt.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
