name: Generate DarrenDang.com Book Films

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-book-films.py"
      - ".github/workflows/generate-book-films.yml"
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-book-films
  cancel-in-progress: true

jobs:
  generate:
    if: github.event_name != 'issues' || github.event.issue.title == 'generate-book-films'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install --disable-pip-version-check pillow numpy

      - name: Generate 30-second book films
        run: python scripts/generate-book-films.py --output public/videos

      - name: Verify media outputs
        run: |
          test -s public/videos/for-those-who-come-after-us-book-film.mp4
          test -s public/videos/wisdom-has-no-rank-book-film.mp4
          test -s public/videos/dots-book-film.mp4
          test -s public/videos/for-those-who-come-after-us-book-film-poster.jpg
          test -s public/videos/wisdom-has-no-rank-book-film-poster.jpg
          test -s public/videos/dots-book-film-poster.jpg
          for f in public/videos/*-book-film.mp4; do
            test "$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f" | cut -d. -f1)" = "30"
          done

      - name: Commit generated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos
          if git diff --cached --quiet; then
            echo "Book films are already current."
          else
            git commit -m "Add generated trilogy book films"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

# This workflow intentionally commits only generated public media.
