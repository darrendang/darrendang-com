name: Generate DarrenDang.com Book Films

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-book-films.py"
      - ".github/workflows/generate-book-films.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-book-films
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install --disable-pip-version-check pillow numpy

      - name: Prepare public video directory
        run: |
          mkdir -p public/videos
          rm -f public/videos/test.mp4
          rm -rf public/videos/for-those-who-come-after-us-book-film
          rm -rf public/videos/wisdom-has-no-rank-book-film
          rm -rf public/videos/dots-book-film

      - name: Recreate 30-second book films
        run: python scripts/generate-book-films.py --output public/videos

      - name: Verify media outputs
        run: |
          test -s public/videos/for-those-who-come-after-us-book-film.mp4
          test -s public/videos/wisdom-has-no-rank-book-film.mp4
          test -s public/videos/dots-book-film.mp4
          test -s public/videos/for-those-who-come-after-us-book-film-poster.jpg
          test -s public/videos/wisdom-has-no-rank-book-film-poster.jpg
          test -s public/videos/dots-book-film-poster.jpg
          for f in public/videos/*-book-film.mp4; do
            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f")"
            python -c 'import sys; seconds=float(sys.argv[1]); assert 29.5 <= seconds <= 30.5, seconds' "$duration"
          done

      - name: Commit generated media
        run: |
          # Keep only deployable media in public/videos; render intermediates stay out of Git.
          rm -f public/videos/test.mp4
          rm -rf public/videos/for-those-who-come-after-us-book-film
          rm -rf public/videos/wisdom-has-no-rank-book-film
          rm -rf public/videos/dots-book-film
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/videos
          if git diff --cached --quiet; then
            echo "Book films are already current."
          else
            git commit -m "Add generated trilogy book films"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

# Public-safe generated media only. Refreshed 2026-08-24 after Actions permissions were enabled.
