<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
<title id="title">Wisdom Has No Rank book cover</title><desc id="desc">Midnight navy cover with an ivory title, a gold North Star, two illuminated paths crossing through a mountain valley, and a shared sunrise.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#061523"/><stop offset=".58" stop-color="#0D2134"/><stop offset=".82" stop-color="#342A25"/><stop offset="1" stop-color="#081522"/></linearGradient>
  <radialGradient id="dawn" cx="50%" cy="66%" r="34%"><stop offset="0" stop-color="#F8D68A" stop-opacity=".96"/><stop offset=".22" stop-color="#DFAE56" stop-opacity=".55"/><stop offset=".65" stop-color="#A36E30" stop-opacity=".13"/><stop offset="1" stop-color="#0D1F31" stop-opacity="0"/></radialGradient>
  <linearGradient id="road" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8F622A"/><stop offset=".42" stop-color="#D8A84E"/><stop offset=".8" stop-color="#F0C874"/><stop offset="1" stop-color="#FFF0B6"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
</defs>
<rect width="720" height="1080" fill="url(#sky)"/><rect width="720" height="1080" fill="url(#dawn)"/>
<!-- north star -->
<g transform="translate(360 72)" fill="#DDAE45"><path d="M0-30 5-7 0 0-5-7Z"/><path d="M0 30 5 7 0 0-5 7Z"/><path d="M-30 0-7-5 0 0-7 5Z"/><path d="M30 0 7-5 0 0 7 5Z"/><path d="m-18-18 13 9 5 9-9-5Z"/><path d="m18-18-13 9-5 9 9-5Z"/><path d="m-18 18 13-9 5-9-9 5Z"/><path d="m18 18-13-9-5-9 9 5Z"/></g>
<!-- title -->
<g text-anchor="middle" fill="#F4E7CF" font-family="Georgia, 'Times New Roman', serif" letter-spacing="6">
  <text x="360" y="225" font-size="104">WISDOM</text>
  <text x="360" y="302" font-size="54" letter-spacing="12">HAS NO</text>
  <text x="360" y="410" font-size="112" letter-spacing="14">RANK</text>
</g>
