<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
<title id="title">D.O.T.S. book cover</title><desc id="desc">Midnight navy cover with an ivory title, a gold North Star, a network of luminous dots and arcs over a dark landscape, and a winding path toward a shared horizon of light.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#061523"/><stop offset=".62" stop-color="#0B1D30"/><stop offset="1" stop-color="#07131F"/></linearGradient>
  <radialGradient id="dawn" cx="50%" cy="67%" r="36%"><stop offset="0" stop-color="#FFF1B6" stop-opacity=".95"/><stop offset=".18" stop-color="#DFAE56" stop-opacity=".58"/><stop offset=".52" stop-color="#9C6A32" stop-opacity=".14"/><stop offset="1" stop-color="#0D1F31" stop-opacity="0"/></radialGradient>
  <linearGradient id="path" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9D6D2F"/><stop offset=".55" stop-color="#D9AA52"/><stop offset="1" stop-color="#FFE8A5"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="720" height="1080" fill="url(#sky)"/><rect width="720" height="1080" fill="url(#dawn)"/>
<!-- north star -->
<g transform="translate(360 70)" fill="#DDAE45"><path d="M0-29 5-7 0 0-5-7Z"/><path d="M0 29 5 7 0 0-5 7Z"/><path d="M-29 0-7-5 0 0-7 5Z"/><path d="M29 0 7-5 0 0 7 5Z"/><path d="m-17-17 12 8 5 9-9-5Z"/><path d="m17-17-12 8-5 9 9-5Z"/><path d="m-17 17 12-8 5-9-9 5Z"/><path d="m17 17-12-8-5-9 9 5Z"/></g>
<!-- title -->
<text x="360" y="248" text-anchor="middle" fill="#F1D9AA" font-family="Georgia, 'Times New Roman', serif" font-size="118" letter-spacing="10">D.O.T.S.</text>
<g stroke="#C79A45" stroke-width="1.4" fill="#C79A45"><path d="M214 292H506"/><path d="m360 285 7 7-7 7-7-7Z"/></g>
<text x="360" y="332" text-anchor="middle" fill="#F3E0BC" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing=".8">Collect Dots. Connect Dots. Create Something New.</text>
