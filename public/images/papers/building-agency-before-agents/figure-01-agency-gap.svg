<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Figure 1. The Agency Gap</title>
<desc id="desc">Conceptual comparison of technical capabilities such as retrieving data, recommending, using tools, and executing; against institutional prerequisites including purpose, authoritative knowledge, judgment, decision rights, oversight, and correction. A not-equal symbol divides the two. No numeric comparison is implied.</desc>
<rect x="0" y="0" width="1200" height="700" rx="0" fill="#FBF8F2"/>
<text x="54" y="54" font-family="'Source Sans 3','Arial',sans-serif" font-size="17" font-weight="700" fill="#705A3D" text-anchor="start" letter-spacing="1.8">FIGURE 1 · CONCEPTUAL DIAGNOSTIC</text>
<text x="54" y="118" font-family="'Newsreader',Georgia,serif" font-size="54" font-weight="500" fill="#0D1F31" text-anchor="start">The Agency Gap</text>
<text x="54" y="159" font-family="'Source Sans 3','Arial',sans-serif" font-size="24" font-weight="400" fill="#4F5963" text-anchor="start">Technical ability does not, by itself, establish legitimate authority.</text>
<rect x="54" y="207" width="475" height="355" rx="20" fill="#14283B"/>
<rect x="672" y="207" width="475" height="355" rx="20" fill="#F5EFE4" stroke="#C79A45" stroke-width="2"/>
<text x="84" y="260" font-family="'Source Sans 3','Arial',sans-serif" font-size="19" font-weight="700" fill="#C79A45" text-anchor="start" letter-spacing="1.5">TECHNICAL CAPABILITY</text>
<text x="700" y="260" font-family="'Source Sans 3','Arial',sans-serif" font-size="19" font-weight="700" fill="#705A3D" text-anchor="start" letter-spacing="1.5">INSTITUTIONAL AGENCY</text>
<text x="84" y="306" font-family="'Source Sans 3','Arial',sans-serif" font-size="29" font-weight="600" fill="#FFFFFF" text-anchor="start">What an AI agent can do</text>
<text x="700" y="306" font-family="'Source Sans 3','Arial',sans-serif" font-size="29" font-weight="600" fill="#0D1F31" text-anchor="start">What the institution can own</text>
<text x="86" y="344" font-family="'Source Sans 3','Arial',sans-serif" font-size="17" font-weight="700" fill="#C79A45" text-anchor="start">01</text>
<text x="124" y="344" font-family="'Source Sans 3','Arial',sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start">Retrieve information</text>
<text x="700" y="344" font-family="'Source Sans 3','Arial',sans-serif" font-size="17" font-weight="700" fill="#705A3D" text-anchor="start">01</text>
<text x="740" y="344" font-family="'Source Sans 3','Arial',sans-serif" font-size="22" font-weight="400" fill="#17202A" text-anchor="start">Purpose and success criteria</text>
<text x="86" y="387" font-family="'Source Sans 3','Arial',sans-serif" font-size="17" font-weight="700" fill="#C79A45" text-anchor="start">02</text>
<text x="124" y="387" font-family="'Source Sans 3','Arial',sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start">Generate recommendations</text>
<text x="700" y="387" font-family="'Source Sans 3','Arial',sans-serif" font-size="17" font-weight="700" fill="#705A3D" text-anchor="start">02</text>
<text x="740" y="387" font-family="'Source Sans 3','Arial',sans-serif" font-size="22" font-weight="400" fill="#17202A" text-anchor="start">Authoritative knowledge</text>
<text x="86" y="430" font-family="'Source Sans 3','Arial',sans-serif" font-size="17" font-weight="700" fill="#C79A45" text-anchor="start">03</text>
<text x="124" y="430" font-family="'Source Sans 3','Arial',sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start">Use tools and systems</text>
<text x="700" y="430" font-family="'Source Sans 3','Arial',sans-serif" font-size="17" font-weight="700" fill="#705A3D" text-anchor="start">03</text>
<text x="740" y="430" font-family="'Source Sans 3','Arial',sans-serif" font-size="22" font-weight="400" fill="#17202A" text-anchor="start">Judgment and decision rights</text>
<text x="86" y="473" font-family="'Source Sans 3','Arial',sans-serif" font-size="17" font-weight="700" fill="#C79A45" text-anchor="start">04</text>
<text x="124" y="473" font-family="'Source Sans 3','Arial',sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start">Execute workflows</text>
<text x="700" y="473" font-family="'Source Sans 3','Arial',sans-serif" font-size="17" font-weight="700" fill="#705A3D" text-anchor="start">04</text>
<text x="740" y="473" font-family="'Source Sans 3','Arial',sans-serif" font-size="22" font-weight="400" fill="#17202A" text-anchor="start">Authority and oversight</text>
<text x="86" y="516" font-family="'Source Sans 3','Arial',sans-serif" font-size="17" font-weight="700" fill="#C79A45" text-anchor="start">05</text>
<text x="124" y="516" font-family="'Source Sans 3','Arial',sans-serif" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start">Coordinate steps</text>
<text x="700" y="516" font-family="'Source Sans 3','Arial',sans-serif" font-size="17" font-weight="700" fill="#705A3D" text-anchor="start">05</text>
<text x="740" y="516" font-family="'Source Sans 3','Arial',sans-serif" font-size="22" font-weight="400" fill="#17202A" text-anchor="start">Learning and correction</text>
<rect x="555" y="334" width="91" height="77" rx="38" fill="#FBF8F2" stroke="#C79A45" stroke-width="2"/>
<line x1="577" y1="361" x2="622" y2="361" stroke="#0D1F31" stroke-width="5" stroke-linecap="round"/>
<line x1="577" y1="377" x2="622" y2="377" stroke="#0D1F31" stroke-width="5" stroke-linecap="round"/>
<line x1="587" y1="389" x2="612" y2="348" stroke="#0D1F31" stroke-width="4" stroke-linecap="round"/>
<text x="600" y="601" font-family="'Source Sans 3','Arial',sans-serif" font-size="20" font-weight="400" fill="#4F5963" text-anchor="middle">The gap is assessed by workflow, not assumed to be an enterprise-wide score.</text>
<line x1="54" y1="625" x2="1147" y2="625" stroke="#E6DDCF" stroke-width="2" stroke-linecap="round"/>
<text x="54" y="660" font-family="'Source Sans 3','Arial',sans-serif" font-size="16" font-weight="700" fill="#705A3D" text-anchor="start" letter-spacing="1.3">PROPOSED FRAMEWORK · NOT EMPIRICAL MEASUREMENT</text>
</svg>