<text x="600" y="517" font-family="'Source Sans 3','Arial',sans-serif" font-size="18" font-weight="700" fill="#705A3D" text-anchor="middle" letter-spacing="1.1">REPEAT WITH BETTER EVIDENCE AND GREATER HUMAN CAPACITY</text>
