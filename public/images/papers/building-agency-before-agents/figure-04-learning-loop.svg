<text x="221" y="329" font-family="'Source Sans 3','Arial',sans-serif" font-size="17" font-weight="700" fill="#0D1F31" text-anchor="start">CONNECT</text>
<text x="221" y="364" font-family="'Source Sans 3','Arial',sans-serif" font-size="15" font-weight="400" fill="#4F5963" text-anchor="start">Find context</text>
