<text x="545" y="329" font-family="'Source Sans 3','Arial',sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">ACT / CREATE</text>
<text x="545" y="364" font-family="'Source Sans 3','Arial',sans-serif" font-size="15" font-weight="400" fill="#FFFFFF" text-anchor="start">Test in reality</text>
