<text x="869" y="329" font-family="'Source Sans 3','Arial',sans-serif" font-size="17" font-weight="700" fill="#0D1F31" text-anchor="start">LEARN</text>
<text x="869" y="364" font-family="'Source Sans 3','Arial',sans-serif" font-size="15" font-weight="400" fill="#4F5963" text-anchor="start">Update judgment</text>
<line x1="1007" y1="320" x2="1016" y2="320" stroke="#705A3D" stroke-width="1.8" stroke-linecap="round"/><path d="M1005.8,326.3 L1016,320 L1005.8,313.7" fill="none" stroke="#705A3D" stroke-width="1.8" stroke-linejoin="round"/>
