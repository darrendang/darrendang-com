<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Figure 4. Institutional Learning Loop</title>
<desc id="desc">Cycle: Capture evidence; Connect context; Judge choices; Act or Create; Observe consequences; Learn from results; Steward and pass forward; Repeat with better evidence and greater human capacity. A conceptual adaptation of the governed Dang OS learning loop, not a claim of empirical validation.</desc>
<rect x="0" y="0" width="1200" height="700" rx="0" fill="#FBF8F2"/>
<text x="52" y="56" font-family="'Source Sans 3','Arial',sans-serif" font-size="17" font-weight="700" fill="#705A3D" text-anchor="start" letter-spacing="1.7">FIGURE 4 · ILLUSTRATIVE STEWARDSHIP LOOP</text>
<text x="52" y="119" font-family="'Newsreader',Georgia,serif" font-size="47" font-weight="500" fill="#0D1F31" text-anchor="start">Institutional learning is continuous</text>
<text x="52" y="160" font-family="'Source Sans 3','Arial',sans-serif" font-size="22" font-weight="400" fill="#4F5963" text-anchor="start">Every consequential action should have a path back to improved understanding.</text>
<rect x="44" y="237" width="151" height="174" rx="14" fill="#F5EFE4" stroke="#E6DDCF" stroke-width="2"/>
<text x="59" y="282" font-family="'Source Sans 3','Arial',sans-serif" font-size="19" font-weight="700" fill="#705A3D" text-anchor="start">01</text>
<text x="59" y="329" font-family="'Source Sans 3','Arial',sans-serif" font-size="17" font-weight="700" fill="#0D1F31" text-anchor="start">CAPTURE</text>
<text x="59" y="364" font-family="'Source Sans 3','Arial',sans-serif" font-size="15" font-weight="400" fill="#4F5963" text-anchor="start">Preserve evidence</text>
