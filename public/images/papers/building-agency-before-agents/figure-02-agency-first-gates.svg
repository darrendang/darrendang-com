<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Figure 2. Agency-First Maturity Model</title>
<desc id="desc">Five readiness gates: Purpose (outcome and harm criteria), Knowledge (sources dates and permissions), Judgment (criteria exceptions owners), Governance (constraints audit interruption correction), and Bounded Delegation (scoped authority pilot evidence). Experiments may occur throughout, but consequential delegation requires relevant gates to be met and revisited.</desc>
<rect x="0" y="0" width="1200" height="700" rx="0" fill="#FBF8F2"/>
<text x="50" y="56" font-family="'Source Sans 3','Arial',sans-serif" font-size="17" font-weight="700" fill="#705A3D" text-anchor="start" letter-spacing="1.8">FIGURE 2 · READINESS GATES</text>
<text x="50" y="120" font-family="'Newsreader',Georgia,serif" font-size="50" font-weight="500" fill="#0D1F31" text-anchor="start">Agency-First Maturity Model</text>
<text x="50" y="160" font-family="'Source Sans 3','Arial',sans-serif" font-size="23" font-weight="400" fill="#4F5963" text-anchor="start">Earn the permission to delegate consequential actions.</text>
