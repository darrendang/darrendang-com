<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1020" viewBox="0 0 1000 1020" role="img" aria-labelledby="title description">
<title id="title">Figure 1. The Way Forward Cycle</title><desc id="description">Learn, know, discover, create, transmit, learn again; the reader moves from The Way to Your Way to The Way Forward.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L6 3 L0 6 z" fill="#4F5963"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<path d="M605 171 Q690 190 730 245" stroke="#4F5963" stroke-width="2.5" fill="none"  marker-end="url(#arr)"/><path d="M845 427 Q865 488 840 544" stroke="#4F5963" stroke-width="2.5" fill="none"  marker-end="url(#arr)"/><path d="M727 704 Q675 756 605 793" stroke="#4F5963" stroke-width="2.5" fill="none"  marker-end="url(#arr)"/><path d="M395 793 Q310 754 272 704" stroke="#4F5963" stroke-width="2.5" fill="none"  marker-end="url(#arr)"/><path d="M160 544 Q135 490 155 430" stroke="#4F5963" stroke-width="2.5" fill="none"  marker-end="url(#arr)"/><path d="M270 245 Q312 195 395 171" stroke="#4F5963" stroke-width="2.5" fill="none"  marker-end="url(#arr)"/><circle cx="500" cy="125" r="99" fill="#fff" stroke="#17202A" stroke-width="2.5"/><text x="500" y="99" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" font-weight="650" fill="#17202A" text-anchor="middle">LEARN</text><text x="500" y="155" font-family="'Source Sans 3', Arial, sans-serif" font-size="17" font-weight="400" fill="#17202A" text-anchor="middle">Be open.</text><text x="500" y="177" font-family="'Source Sans 3', Arial, sans-serif" font-size="17" font-weight="400" fill="#17202A" text-anchor="middle">Take it in.</text><circle cx="780" cy="335" r="105" fill="#fff" stroke="#17202A" stroke-width="2.5"/><text x="780" y="309" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" font-weight="650" fill="#17202A" text-anchor="middle">KNOW</text><text x="780" y="365" font-family="'Source Sans 3', Arial, sans-serif" font-size="17" font-weight="400" fill="#17202A" text-anchor="middle">Make sense.</text><text x="780" y="387" font-family="'Source Sans 3', Arial, sans-serif" font-size="17" font-weight="400" fill="#17202A" text-anchor="middle">Find meaning.</text><circle cx="780" cy="650" r="105" fill="#fff" stroke="#17202A" stroke-width="2.5"/><text x="780" y="624" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" font-weight="650" fill="#17202A" text-anchor="middle">DISCOVER</text><text x="780" y="680" font-family="'Source Sans 3', Arial, sans-serif" font-size="17" font-weight="400" fill="#17202A" text-anchor="middle">See with fresh eyes.</text><circle cx="500" cy="845" r="105" fill="#fff" stroke="#17202A" stroke-width="2.5"/><text x="500" y="819" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" font-weight="650" fill="#17202A" text-anchor="middle">CREATE</text><text x="500" y="875" font-family="'Source Sans 3', Arial, sans-serif" font-size="17" font-weight="400" fill="#17202A" text-anchor="middle">Bring it to life.</text><text x="500" y="897" font-family="'Source Sans 3', Arial, sans-serif" font-size="17" font-weight="400" fill="#17202A" text-anchor="middle">Make it real.</text><circle cx="220" cy="650" r="105" fill="#fff" stroke="#17202A" stroke-width="2.5"/><text x="220" y="624" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" font-weight="650" fill="#17202A" text-anchor="middle">TRANSMIT</text><text x="220" y="680" font-family="'Source Sans 3', Arial, sans-serif" font-size="17" font-weight="400" fill="#17202A" text-anchor="middle">Open the way</text><text x="220" y="702" font-family="'Source Sans 3', Arial, sans-serif" font-size="17" font-weight="400" fill="#17202A" text-anchor="middle">for others.</text><circle cx="220" cy="335" r="105" fill="#fff" stroke="#17202A" stroke-width="2.5"/><text x="220" y="294.5" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" font-weight="650" fill="#17202A" text-anchor="middle">LEARN</text><text x="220" y="323.5" font-family="'Source Sans 3', Arial, sans-serif" font-size="28" font-weight="650" fill="#17202A" text-anchor="middle">AGAIN</text><text x="220" y="365" font-family="'Source Sans 3', Arial, sans-serif" font-size="17" font-weight="400" fill="#17202A" text-anchor="middle">Stay curious.</text><text x="220" y="387" font-family="'Source Sans 3', Arial, sans-serif" font-size="17" font-weight="400" fill="#17202A" text-anchor="middle">Keep going.</text><circle cx="500" cy="487" r="145" fill="#F5F5F4" stroke="none"/><text x="500" y="428" font-family="Georgia, 'Newsreader', serif" font-size="39" font-weight="450" fill="#17202A" text-anchor="middle">The Way</text><text x="500" y="462" font-family="'Source Sans 3', Arial, sans-serif" font-size="30" font-weight="400" fill="#17202A" text-anchor="middle">↓</text><text x="500" y="510" font-family="Georgia, 'Newsreader', serif" font-size="39" font-weight="450" fill="#17202A" text-anchor="middle">Your Way</text><text x="500" y="544" font-family="'Source Sans 3', Arial, sans-serif" font-size="30" font-weight="400" fill="#17202A" text-anchor="middle">↓</text><text x="500" y="593" font-family="Georgia, 'Newsreader', serif" font-size="34" font-weight="650" fill="#17202A" text-anchor="middle">The Way Forward</text><text x="500" y="979" font-family="Georgia, 'Newsreader', serif" font-size="22" font-weight="400" fill="#17202A" text-anchor="middle">Receive → Examine → Transform → Create → Pass forward → Learn again</text>
</svg>

